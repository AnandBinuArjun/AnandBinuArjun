<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><title>Security Research Lab</title><defs><linearGradient id="e"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs><rect width="1200" height="520" rx="28" fill="#05070b"/><rect x="1" y="1" width="1198" height="518" rx="27" fill="none" stroke="url(#e)" stroke-opacity=".45"/><rect width="1200" height="2" fill="#22d3ee" opacity=".3"><animate attributeName="y" values="-2;520;-2" dur="8s" repeatCount="indefinite"/></rect><text x="48" y="48" fill="#22d3ee" font-family="monospace" font-size="12">&gt; SECURITY_OS / RESEARCH_LAB</text><text x="48" y="82" fill="#f8fafc" font-family="Arial" font-size="28" font-weight="800">RESEARCH LAB</text><text x="48" y="105" fill="#64748b" font-family="monospace" font-size="10">HYPOTHESIS → EXPERIMENT → EVIDENCE → ITERATION</text><g font-family="monospace" font-size="10"><rect x="40" y="135" width="540" height="92" rx="16" fill="#08131b" stroke="#22d3ee" stroke-opacity=".5"/><text x="62" y="163" fill="#22d3ee">01 · AI SECURITY</text><text x="62" y="190" fill="#e2e8f0" font-family="Arial" font-size="15">LLM security · agents · security automation</text><rect x="620" y="135" width="540" height="92" rx="16" fill="#100d1c" stroke="#8b5cf6" stroke-opacity=".5"/><text x="642" y="163" fill="#a78bfa">02 · THREAT INTELLIGENCE</text><text x="642" y="190" fill="#e2e8f0" font-family="Arial" font-size="15">IOC extraction · ATT&amp;CK · knowledge graphs</text><rect x="40" y="250" width="540" height="92" rx="16" fill="#071713" stroke="#34d399" stroke-opacity=".5"/><text x="62" y="278" fill="#34d399">03 · IoT / EMBEDDED</text><text x="62" y="305" fill="#e2e8f0" font-family="Arial" font-size="15">IoT security · CAN bus · automotive · devices</text><rect x="620" y="250" width="540" height="92" rx="16" fill="#0d121b" stroke="#fbbf24" stroke-opacity=".5"/><text x="642" y="278" fill="#fbbf24">