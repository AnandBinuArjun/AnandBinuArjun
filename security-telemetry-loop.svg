<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430"><defs><style>.t{font:700 11px ui-monospace,monospace;fill:#22d3ee;letter-spacing:2px}.h{font:700 25px ui-monospace,monospace;fill:#e2e8f0}.s{font:11px ui-monospace,monospace;fill:#94a3b8}.n{font:700 12px ui-monospace,monospace;fill:#e2e8f0}.v{font:700 12px ui-monospace,monospace;fill:#34d399}@keyframes dash{to{stroke-dashoffset:-120}}@keyframes p{50%{opacity:.25}}.flow{stroke-dasharray:8 14;animation:dash 2s linear infinite}.pulse{animation:p 1.8s infinite}</style></defs><rect width="1400" height="430" rx="24" fill="#05070b" stroke="#26364f"/><text x="32" y="38" class="t">// SECURITY TELEMETRY LOOP</text><text x="32" y="72" class="h">COLLECT → NORMALIZE → CORRELATE → PRIORITIZE → LEARN</text><g fill="none" stroke="#26364f" stroke-width="2"><path class="flow" d="M205 210H315"/><path class="flow" d="M455 210H565"/><path class="flow" d="M705 210H815"/><path class="flow" d="M955 210H1065"/><path class="flow" d="M1205 210H1320"/></g><g><rect x="35" y="145" width="170" height="130" rx="16" fill="#091019" stroke="#22d3ee"/><text x="58" y="178" class="t">01</text><text x="58" y="208" class="n">COLLECT</text><text x="58" y="235" class="s">events · logs</text><text x="58" y="257" class="s">signals · telemetry</text><circle cx="187" cy="178" r="6" fill="#22d3ee" class="pulse"/></g><g><rect x="315" y="145" width="140" height="130" rx="16" fill="#091019" stroke="#60a5fa"/><text x="338" y="178" class="t">02</text><text x="338" y="208" class="n">NORMALIZE</text><text x="338" y="235" class="s">schema · context</text><circle cx="437" cy="178" r="6" fill="#60a5fa" class="pulse"/></g><g><rect x="565" y="145" width="140" height="130" rx="16" fill="#091019" stroke="#8b5cf6"/><text x="588" y="178" class="t">03</text><text x="588" y="208" class="n">CORRELATE</text><text x="588" y="235" class="s">entities · paths</text><circle cx="687" cy="178" r="6" fill="#8b5cf6" class="pulse"/></g><g><rect x="815" y="145" width="140" height="130" rx="16" fill="#091019" stroke="#f59e0b"/><text x="838" y="178" class="t">04</text><text x="838" y="208" class="n">PRIORITIZE</text><text x="838" y="235" class="s">risk · impact</text><circle cx="937" cy="178" r="6" fill="#f59e0b" class="pulse"/></g><g><rect x="1065" y="145" width="140" height="130" rx="16" fill="#091019" stroke="#34d399"/><text x="1088" y="178" class="t">05</text><text x="1088" y="208" class="n">LEARN</text><text x="1088" y="235" class="s">outcomes · tuning</text><circle cx="1187" cy="178" r="6" fill="#34d399" class="pulse"/></g><g><rect x="1240" y="145" width="125" height="130" rx="16" fill="#0a1515" stroke="#34d399"/><text x="1260" y="178" class="t">LOOP</text><text x="1260" y="210" class="v">FEEDBACK</text><text x="1260" y="236" class="s">evidence</text><text x="1260" y="257" class="s">improves signal</text></g><rect x="35" y="330" width="1330" height="58" rx="14" fill="#081019" stroke="#26364f"/><text x="58" y="365" class="s">Telemetry is contextualized before decisions: source → time → asset → identity → relationship → outcome.</text><text x="1342" y="365" text-anchor="end" class="v">CONCEPTUAL PROFILE MODEL</text></svg>