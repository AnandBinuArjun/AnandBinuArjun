<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><title>Beyond the Terminal</title><rect width="1200" height="430" rx="28" fill="#05070b"/><rect x="1" y="1" width="1198" height="428" rx="27" fill="#07101a" stroke="#22d3ee" stroke-opacity=".45"/><rect width="1200" height="2" fill="#22d3ee" opacity=".3"><animate attributeName="y" values="-2;430;-2" dur="8s" repeatCount="indefinite"/></rect><text x="48" y="48" fill="#22d3ee" font-family="monospace" font-size="12">&gt; SECURITY_OS / BEYOND_THE_TERMINAL</text><text x="48" y="82" fill="#f8fafc" font-family="Arial" font-size="28" font-weight="800">BEYOND THE TERMINAL</text><text x="48" y="106" fill="#64748b" font-family="monospace" font-size="10">THE HUMAN LAYER BEHIND THE SECURITY SYSTEM</text><g font-family="monospace"><rect x="45" y="135" width="250" height="115" rx="16" fill="#100d1c" stroke="#8b5cf6" stroke-opacity=".6"/><text x="68" y="168" fill="#a78bfa" font-size="10">01 · MUSIC</text><text x="68" y="202" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="800">VIOLIN</text><text x="68" y="226" fill="#94a3b8" font-size="9">discipline · listening · creativity</text><rect x="315" y="135" width="250" height="115" rx="16" fill="#08131b" stroke="#22d3ee" stroke-opacity=".6"/><text x="338" y="168" fill="#22d3ee" font-size="10">02 · RESEARCH</text><text x="338" y="202" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="800">SECURITY LAB</text><text x="338" y="226" fill="#94a3b8" font-size="9">AI · threat intel · IoT · DFIR</text><rect x="585" y="135" width="250" height="115" rx="16" fill="#071713" stroke="#34d399" stroke-opacity=".6"/><text x="608" y="168" fill="#34d399" font-size="10">03 · BUILDING</text><text x="608" y="202" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="800">PRODUCTS</text><text x="608" y="226" fill="#94a3b8" font-size="9">ideas → prototypes → useful systems</text><rect x="855" y="135" width="300" height="115" rx="16" fill="#0a101a" stroke="#fbbf24" stroke-opacity=".6"/><text x="878" y="168" fill="#fbbf24" font-size="10">04 · OPEN SOURCE</text><text x="878" y="202" fill="#f8fafc" font-family="Arial" font-size="18" font-weight="800">SHARE THE WORK</text><text x="878" y="226" fill="#94a3b8" font-size="9">tools · writing · reusable engineering</text><rect x="45" y="275" width="1110" height="95" rx="16" fill="#08101a" stroke="#334155"/><text x="68" y="307" fill="#94a3b8" font-size="9">PERSONAL OPERATING LOOP</text><text x="68" y="340" fill="#f8fafc" font-family="Arial" font-size="17" font-weight="700">LEARN</text><path d="M145 336h95" stroke="#22d3ee"/><text x="250" y="340" fill="#f8fafc" font-family="Arial" font-size="17" font-weight="700">BUILD</text><path d="M330 336h95" stroke="#8b5cf6"/><text x="440" y="340" fill="#f8fafc" font-family="Arial" font-size="17" font-weight="700">TEST</text><path d="M515 336h95" stroke="#34d399"/><text x="625" y="340" fill="#f8fafc" font-family="Arial" font-size="17" font-weight="700">SHARE</text><path d="M700 336h95" stroke="#fbbf24"/><text x="810" y="340" fill="#f8fafc" font-family="Arial" font-size="17" font-weight="700">ITERATE</text><text x="68" y="355" fill="#64748b" font-size="8">curiosity stays outside the terminal — but it feeds everything inside it</text></g></svg>