<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430"><defs><style>.t{font:700 11px ui-monospace,monospace;fill:#22d3ee;letter-spacing:2px}.h{font:700 25px ui-monospace,monospace;fill:#e2e8f0}.s{font:11px ui-monospace,monospace;fill:#94a3b8}.n{font:700 12px ui-monospace,monospace;fill:#e2e8f0}.ok{font:700 12px ui-monospace,monospace;fill:#34d399}@keyframes p{50%{opacity:.25}}@keyframes dash{to{stroke-dashoffset:-100}}.p{animation:p 2s infinite}.flow{stroke-dasharray:7 13;animation:dash 2s linear infinite}</style></defs><rect width="1400" height="430" rx="24" fill="#05070b" stroke="#26364f"/><text x="32" y="38" class="t">// HUMAN GOVERNANCE</text><text x="32" y="72" class="h">AI OUTPUT → EVIDENCE → POLICY → HUMAN DECISION</text><g><rect x="38" y="125" width="250" height="180" rx="18" fill="#091019" stroke="#26364f"/><text x="62" y="158" class="t">AI OUTPUT</text><text x="62" y="194" class="n">Risk hypothesis</text><text x="62" y="220" class="s">classification · explanation</text><text x="62" y="250" class="n">Confidence</text><text x="62" y="276" class="s">bounded, not authoritative</text><circle cx="258" cy="157" r="6" fill="#8b5cf6" class="p"/></g><g><rect x="390" y="125" width="250" height="180" rx="18" fill="#091019" stroke="#26364f"/><text x="414" y="158" class="t">EVIDENCE</text><text x="414" y="194" class="n">Telemetry</text><text x="414" y="220" class="s">logs · IOCs · events</text><text x="414" y="250" class="n">Context</text><text x="414" y="276" class="s">asset · identity · history</text><circle cx="610" cy="157" r="6" fill="#22d3ee" class="p"/></g><g><rect x="742" y="125" width="250" height="180" rx="18" fill="#091019" stroke="#26364f"/><text x="766" y="158" class="t">POLICY</text><text x="766" y="194" class="n">Permissions</text><text x="766" y="220" class="s">role · scope · asset class</text><text x="766" y="250" class="n">Guardrails</text><text x="766" y="276" class="s">approval · dry-run · rollback</text><circle cx="962" cy="157" r="6" fill="#f59e0b" class="p"/></g><g><rect x="1094" y="125" width="268" height="180" rx="18" fill="#0a1515" stroke="#34d399"/><text x="1118" y="158" class="t">HUMAN DECISION</text><text x="1118" y="194" class="n">Approve</text><text x="1118" y="220" class="s">execute bounded action</text><text x="1118" y="250" class="n">Reject / Escalate</text><text x="1118" y="276" class="s">preserve evidence</text><circle cx="1332" cy="157" r="6" fill="#34d399" class="p"/></g><g stroke="#26364f" stroke-width="2" fill="none"><path class="flow" d="M288 215H390"/><path class="flow" d="M640 215H742"/><path class="flow" d="M992 215H1094"/></g><text x="38" y="350" class="t">SAFETY PRINCIPLE</text><text x="38" y="377" class="s">AI proposes. Evidence supports. Policy constrains. A human authorizes consequential action.</text><rect x="38" y="400" width="1324" height="2" fill="#26364f"/><rect x="38" y="400" width="330" height="2" fill="#34d399"/></svg>