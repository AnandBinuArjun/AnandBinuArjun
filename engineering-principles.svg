<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500"><defs><style>.t{font:700 11px ui-monospace,monospace;fill:#22d3ee;letter-spacing:2px}.h{font:700 22px ui-monospace,monospace;fill:#e2e8f0}.s{font:11px ui-monospace,monospace;fill:#94a3b8}.n{font:700 11px ui-monospace,monospace;fill:#e2e8f0}.k{font:700 10px ui-monospace,monospace;fill:#22d3ee;letter-spacing:1px}.card{fill:#0b111a;stroke:#26364f}@keyframes scan{0%{transform:translateY(0);opacity:0}15%{opacity:.18}85%{opacity:.18}100%{transform:translateY(420px);opacity:0}}@keyframes p{50%{opacity:.35}}.scan{animation:scan 6s linear infinite}.pulse{animation:p 2s infinite}</style></defs><rect x="2" y="2" width="1396" height="496" rx="22" fill="#05070b" stroke="#26364f"/><text x="30" y="38" class="t">// ENGINEERING PRINCIPLES</text><text x="30" y="70" class="h">HOW THE SYSTEM IS DESIGNED TO THINK</text><rect x="30" y="88" width="1340" height="2" fill="#1e293b"/><rect x="30" y="90" width="3" height="405" fill="#22d3ee" opacity=".18" class="scan"/><g><rect x="55" y="120" width="300" height="325" rx="16" class="card"/><circle cx="82" cy="150" r="6" fill="#22d3ee" class="pulse"/><text x="100" y="154" class="k">SECURITY</text><text x="78" y="195" class="n">01  ASSUME BREACH</text><text x="78" y="235" class="n">02  MINIMIZE TRUST</text><text x="78" y="275" class="n">03  VERIFY CONTINUOUSLY</text><path d="M78 295H325" stroke="#26364f"/><text x="78" y="325" class="s">Trust is earned by evidence.</text><text x="78" y="345" class="s">Controls stay observable.</text><text x="78" y="365" class="s">Verification closes the loop.</text></g><g><rect x="385" y="120" width="300" height="325" rx="16" class="card"/><circle cx="412" cy="150" r="6" fill="#8b5cf6" class="pulse"/><text x="430" y="154" class="k">AI</text><text x="408" y="195" class="n">01  EXPLAIN THE DECISION</text><text x="408" y="235" class="n">02  BOUND THE ACTION</text><text x="408" y="275" class="n">03  KEEP HUMAN CONTROL</text><path d="M408 295H655" stroke="#26364f"/><text x="408" y="325" class="s">Reasoning should be inspectable.</text><text x="408" y="345" class="s">Automation should be bounded.</text><text x="408" y="365" class="s">Risk determines autonomy.</text></g><g><rect x="715" y="120" width="300" height="325" rx="16" class="card"/><circle cx="742" cy="150" r="6" fill="#34d399" class="pulse"/><text x="760" y="154" class="k">ENGINEERING</text><text x="738" y="195" class="n">01  AUTOMATE REPEATABLE WORK</text><text x="738" y="235" class="n">02  MAKE SYSTEMS OBSERVABLE</text><text x="738" y="275" class="n">03  PRESERVE EVIDENCE</text><path d="M738 295H985" stroke="#26364f"/><text x="738" y="325" class="s">Repeatability reduces noise.</text><text x="738" y="345" class="s">Observability exposes failure.</text><text x="738" y="365" class="s">Evidence makes claims testable.</text></g><g><rect x="1045" y="120" width="300" height="325" rx="16" class="card"/><circle cx="1072" cy="150" r="6" fill="#f59e0b" class="pulse"/><text x="1090" y="154" class="k">RESEARCH</text><text x="1068" y="195" class="n">01  FORM A HYPOTHESIS</text><text x="1068" y="235" class="n">02  BUILD AN EXPERIMENT</text><text x="1068" y="275" class="n">03  MEASURE THE RESULT</text><path d="M1068 295H1315" stroke="#26364f"/><text x="1068" y="325" class="s">Questions become experiments.</text><text x="1068" y="345" class="s">Experiments produce evidence.</text><text x="1068" y="365" class="s">Results refine the system.</text></g><text x="700" y="475" text-anchor="middle" class="s">SECURITY × AI × ENGINEERING × RESEARCH</text></svg>