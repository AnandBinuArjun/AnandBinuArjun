<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420"><defs><style>.t{font:700 11px ui-monospace,monospace;fill:#22d3ee;letter-spacing:2px}.h{font:700 23px ui-monospace,monospace;fill:#e2e8f0}.m{font:11px ui-monospace,monospace;fill:#94a3b8}.ok{fill:#34d399}.warn{fill:#f59e0b}@keyframes in{0%,20%{opacity:0;transform:translateX(-12px)}30%,100%{opacity:1;transform:translateX(0)}}.l1{animation:in 6s infinite}.l2{animation:in 6s .8s infinite}.l3{animation:in 6s 1.6s infinite}.l4{animation:in 6s 2.4s infinite}.l5{animation:in 6s 3.2s infinite}</style></defs><rect x="2" y="2" width="1396" height="416" rx="22" fill="#05070b" stroke="#26364f"/><text x="30" y="38" class="t">// SECURITY TERMINAL // EVENT STREAM</text><text x="30" y="70" class="h">$ systemctl status security-lab</text><rect x="55" y="105" width="1290" height="260" rx="14" fill="#020409" stroke="#1e293b"/><g class="m"><text x="82" y="145" class="l1">04:21:02  <tspan class="ok">[OK]</tspan>  profile modules loaded</text><text x="82" y="185" class="l2">04:21:07  <tspan class="ok">[OK]</tspan>  security telemetry pipeline ready</text><text x="82" y="225" class="l3">04:21:12  <tspan class="warn">[WARN]</tspan> anomaly signal queued for analysis</text><text x="82" y="265" class="l4">04:21:19  <tspan class="ok">[OK]</tspan>  evidence verification complete</text><text x="82" y="305" class="l5">04:21:25  <tspan class="ok">[ACTIVE]</tspan> ShieldDesk development loop running</text></g><text x="82" y="340" class="m">anand@security-lab:~$ _</text></svg>