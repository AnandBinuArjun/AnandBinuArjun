name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: profile-3d-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate profile dashboard and real 3D contribution city

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Generate live developer dashboard
        env:
          USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate-dashboard.py

      - name: Remove stale contribution fallback
        run: rm -f profile-3d-contrib/profile-night-view.svg

      - name: Generate real 3D contribution profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Validate generated contribution SVG
        run: |
          set -euo pipefail
          FILE="profile-3d-contrib/profile-night-view.svg"
          test -s "$FILE"
          test "$(wc -c < "$FILE")" -gt 50000
          grep -q "<svg" "$FILE"
          if grep -qi "fallback rendered safely" "$FILE"; then
            echo "Fallback SVG detected; refusing to publish it."
            exit 1
          fi
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("profile-3d-contrib/profile-night-view.svg")
          print("profile-night-view.svg: valid XML/SVG")
          PY

      - name: Refresh contribution image cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path("README.md")
          s = p.read_text()
          run_id = os.environ["GITHUB_RUN_ID"]
          s = re.sub(r'(profile-3d-contrib/profile-night-view)\?v=[^)"\s]+', r'\1?v=' + run_id, s)
          p.write_text(s)
          PY

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: refresh profile dashboard and 3D contribution profile"
            git push
          fi
