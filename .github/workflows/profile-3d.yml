name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate profile dashboard and real 3D contribution city

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v5

      - name: Generate live developer dashboard
        env:
          USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/generate-dashboard.py

      - name: Remove stale contribution fallback
        run: rm -f profile-3d-contrib/profile-night-view.svg

      - name: Generate real 3D contribution profile
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Verify real profile-night-view.svg was generated
        run: |
          set -euo pipefail
          FILE="profile-3d-contrib/profile-night-view.svg"
          test -s "$FILE"
          test "$(wc -c < "$FILE")" -gt 50000
          grep -q "<svg" "$FILE"
          if grep -qi "fallback rendered safely" "$FILE"; then
            echo "Fallback SVG detected; refusing to publish it."
            exit 1
          fi
          echo "Verified generated 3D contribution SVG: $FILE"
          wc -c "$FILE"

      - name: Commit generated profile assets
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "chore: refresh profile dashboard and 3D contribution profile"
            git push
          fi
