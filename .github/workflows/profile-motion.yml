name: Build Profile Motion GIF

on:
  push:
    paths:
      - ".github/workflows/profile-motion.yml"
      - "scripts/profile_motion.py"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade pillow
      - run: python scripts/profile_motion.py
      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-motion.gif
          git diff --cached --quiet || git commit -m "chore: refresh profile motion"
          git push
