<text x="48" y="106" fill="#64748b" font-family="monospace" font-size="10">PRIMARY · WORKING · EXPLORING</text>
<g font-family="Arial">
<rect x="38" y="132" width="356" height="350" rx="20" fill="#071713" stroke="#34d399" stroke-opacity=".65"/>
