<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Anand Binu Arjun — Security Capability Matrix</title>
<desc id="desc">Animated cybersecurity capability matrix grouped into primary, working and exploring areas.</desc>
<defs>
<linearGradient id="edge" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity=".05"/></pattern>
</defs>
<rect width="1200" height="560" rx="28" fill="#05070b"/>
<rect x="1" y="1" width="1198" height="558" rx="27" fill="url(#grid)" stroke="url(#edge)" stroke-opacity=".5"/>
<rect x="0" y="0" width="1200" height="2" fill="#22d3ee" opacity=".35"><animate attributeName="y" values="-2;560;-2" dur="9s" repeatCount="indefinite"/></rect>
<text x="48" y="48" fill="#22d3ee" font-family="monospace" font-size="12" letter-spacing="2">&gt; SECURITY_OS / CAPABILITY_MATRIX</text>
