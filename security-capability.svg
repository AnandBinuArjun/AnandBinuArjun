<g font-family="monospace" font-size="11" fill="#e2e8f0"><text x="58" y="224">01  Offensive Security &amp; VAPT</text><text x="58" y="254">02  Threat Modeling</text><text x="58" y="284">03  Network Security &amp; Defense</text><text x="58" y="314">04  AI × Cybersecurity</text><text x="58" y="344">05  Secure Software Development</text><text x="58" y="374">06  Digital Forensics</text><text x="58" y="404">07  IoT / Embedded Security</text><text x="58" y="434">08  Security Automation</text></g>
<rect x="410" y="132" width="356" height="350" rx="20" fill="#100d1c" stroke="#8b5cf6" stroke-opacity=".7"/>
<circle cx="437" cy="160" r="7" fill="#8b5cf6"><animate attributeName="r" values="6;10;6" dur="2.4s" repeatCount="indefinite"/></circle><text x="456" y="166" fill="#a78bfa" font-size="18" font-weight="800">WORKING</text><text x="430" y="190" fill="#64748b" font-family="monospace" font-size="9">HANDS-ON / INTEGRATION</text>
<g font-family="monospace" font-size="11" fill="#e2e8f0"><text x="430" y="224">01  Threat Intelligence</text><text x="430" y="254">02  Incident Response</text><text x="430" y="284">03  Vulnerability Management</text><text x="430" y="314">04  Cloud Security</text><text x="430" y="344">05  Security Architecture</text><text x="430" y="374">06  Attack-Path Analysis</text><text x="430" y="404">07  Security Knowledge Graphs</text><text x="430" y="434">08  Security Engineering</text></g>
<rect x="782" y="132" width="380" height="350" rx="20" fill="#0a121c" stroke="#22d3ee" stroke-opacity=".65"/>
<circle cx="809" cy="160" r="7" fill="#22d3ee"><animate attributeName="r" values="6;10;6" dur="2.8s" repeatCount="indefinite"/></circle><text x="828" y="166" fill="#22d3ee" font-size="18" font-weight="800">EXPLORING</text><text x="802" y="190" fill="#64748b" font-family="monospace" font-size="9">NEXT TECHNICAL LAYER</text>
<g font-family="monospace" font-size="11" fill="#e2e8f0"><text x="802" y="224">01  LLM &amp; AI Agent Security</text><text x="802" y="254">02  Prompt Injection &amp; AI Abuse</text><text x="802" y="284">03  RAG Security</text><text x="802" y="314">04  Autonomous Security Operations</text><text x="802" y="344">05  AI-Assisted SOC</text><text x="802" y="374">06  Firmware &amp; Device Security</text><text x="802" y="404">07  OT / Industrial Security</text><text x="802" y="434">08  Advanced Forensics &amp; Detection</text></g>
