<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="t d"><title id="t">Anand Binu Arjun security philosophy</title><desc id="d">Security engineering methodology from discovery to learning.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070a0f"/><stop offset="1" stop-color="#0b1119"/></linearGradient><linearGradient id="a"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs><rect width="1400" height="360" rx="26" fill="url(#bg)"/><rect x="1" y="1" width="1398" height="358" rx="25" fill="none" stroke="url(#a)" stroke-opacity=".45"/><g font-family="monospace"><text x="48" y="52" font-size="12" fill="#64748b">SECURITY METHODOLOGY</text><text x="48" y="88" font-family="Arial" font-size="27" font-weight="800" fill="#f8fafc">BUILD → DETECT → EXPLAIN → VERIFY</text><g fill="#e2e8f0"><rect x="48" y="132" width="150" height="120" rx="16" fill="#091019" stroke="#22d3ee"/><text x="123" y="165" text-anchor="middle" font-size="10" fill="#22d3ee">01</text><text x="123" y="196" text-anchor="middle" font-size="16" font-weight="700">BUILD</text><text x="123" y="221" text-anchor="middle" font-size="10" fill="#94a3b8">Useful systems</text><rect x="218" y="132" width="150" height="120" rx="16" fill="#091019" stroke="#60a5fa"/><text x="293" y="165" text-anchor="middle" font-size="10" fill="#60a5fa">02</text><text x="293" y="196" text-anchor="middle" font-size="16" font-weight="700">DETECT</text><text x="293" y="221" text-anchor="middle" font-size="10" fill="#94a3b8">Find signal</text><rect x="388" y="132" width="150" height="120" rx="16" fill="#091019" stroke="#8b5cf6"/><text x="463" y="165" text-anchor="middle" font-size="10" fill="#a78bfa">03</text><text x="463" y="196" text-anchor="middle" font-size="16" font-weight="700">EXPLAIN</text><text x="463" y="221" text-anchor="middle" font-size="10" fill="#94a3b8">Make evidence clear</text><rect x="558" y="132" width="150" height="120" rx="16" fill="#091019" stroke="#34d399"/><text x="633" y="165" text-anchor="middle" font-size="10" fill="#34d399">04</text><text x="633" y="196" text-anchor="middle" font-size="16" font-weight="700">VERIFY</text><text x="633" y="221" text-anchor="middle" font-size="10" fill="#94a3b8">Prove the action</text></g><g><rect x="770" y="132" width="582" height="120" rx="16" fill="#091019" stroke="#243241"/><text x="796" y="164" font-size="10" fill="#64748b">OPERATING PRINCIPLES</text><text x="796" y="194" font-size="13" fill="#e2e8f0">Evidence before automation</text><text x="796" y="218" font-size="13" fill="#e2e8f0">Human governance for consequential actions</text><text x="796" y="242" font-size="13" fill="#e2e8f0">Automate repetitive work, verify meaningful outcomes</text></g><text x="48" y="308" font-size="11" fill="#64748b">The same loop connects ShieldDesk, CTI Analysis, SENTINEL-IoT and forensic automation.</text></g></svg>