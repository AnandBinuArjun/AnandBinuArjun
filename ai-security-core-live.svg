<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430"><defs><style>.t{font:700 11px ui-monospace,monospace;fill:#22d3ee;letter-spacing:2px}.h{font:700 25px ui-monospace,monospace;fill:#e2e8f0}.s{font:11px ui-monospace,monospace;fill:#94a3b8}.n{font:700 12px ui-monospace,monospace;fill:#e2e8f0}.v{font:700 12px ui-monospace,monospace;fill:#34d399}@keyframes dash{to{stroke-dashoffset:-120}}@keyframes p{50%{opacity:.25}}.flow{stroke-dasharray:8 14;animation:dash 2s linear infinite}.pulse{animation:p 1.8s infinite}</style></defs><rect width="1400" height="430" rx="24" fill="#05070b" stroke="#22d3ee" stroke-opacity=".45"/><text x="32" y="38" class="t">// AI SECURITY CORE</text><text x="32" y="72" class="h">SIGNAL → DETECT → CORRELATE → EXPLAIN → VERIFY → DECIDE</text><g fill="none" stroke="#26364f" stroke-width="2"><path class="flow" d="M205 205H335"/><path class="flow" d="M435 205H565"/><path class="flow" d="M665 205H795"/><path class="flow" d="M895 205H1025"/><path class="flow" d="M1125 205H1255"/></g><g><rect x="40" y="150" width="165" height="110" rx="16" fill="#091019" stroke="#26364f"/><text x="62" y="180" class="t">01</text><text x="62" y="208" class="n">SIGNAL</text><text x="62" y="232" class="s">events · alerts</text><circle cx="184" cy="205" r="6" fill="#22d3ee" class="pulse"/></g><g><rect x="335" y="150" width="100" height="110" rx="16" fill="#091019" stroke="#26364f"/><text x="360" y="180" class="t">02</text><text x="360" y="208" class="n">DETECT</text><circle cx="414" cy="205" r="6" fill="#34d399" class="pulse"/></g><g><rect x="565" y="150" width="100" height="110" rx="16" fill="#091019" stroke="#26364f"/><text x="590" y="180" class="t">03</text><text x="590" y="208" class="n">CORRELATE</text><circle cx="644" cy="205" r="6" fill="#8b5cf6" class="pulse"/></g><g><rect x="795" y="150" width="100" height="110" rx="16" fill="#091019" stroke="#26364f"/><text x="820" y="180" class="t">04</text><text x="820" y="208" class="n">EXPLAIN</text><circle cx="874" cy="205" r="6" fill="#60a5fa" class="pulse"/></g><g><rect x="1025" y="150" width="100" height="110" rx="16" fill="#091019" stroke="#26364f"/><text x="1050" y="180" class="t">05</text><text x="1050" y="208" class="n">VERIFY</text><circle cx="1104" cy="205" r="6" fill="#f59e0b" class="pulse"/></g><g><rect x="1255" y="150" width="105" height="110" rx="16" fill="#0b1720" stroke="#34d399"/><text x="1278" y="180" class="t">06</text><text x="1278" y="208" class="n">DECIDE</text><text x="1278" y="232" class="v">HUMAN</text></g><circle cx="700" cy="205" r="104" fill="none" stroke="#22d3ee" stroke-opacity=".08"/><text x="32" y="330" class="t">GOVERNANCE LAYER</text><text x="32" y="355" class="s">Evidence · policy · confidence · blast radius · human approval</text><rect x="32" y="382" width="1330" height="2" fill="#26364f"/><rect x="32" y="382" width="420" height="2" fill="#22d3ee" opacity=".65"/></svg>