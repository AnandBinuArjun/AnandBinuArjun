<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc"><title id="title">Anand Binu Arjun security command center</title><desc id="desc">GitHub and project dashboard.</desc><defs><linearGradient id="edge"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#34d399"/></linearGradient><linearGradient id="bar" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="1200" height="610" rx="28" fill="#05070b"/><rect x="1" y="1" width="1198" height="608" rx="27" fill="none" stroke="url(#edge)" stroke-opacity=".42"/><g font-family="Arial"><text x="50" y="58" fill="#22d3ee" font-family="monospace" font-size="13" letter-spacing="2">&gt; SECURITY_COMMAND_CENTER</text><text x="50" y="94" fill="#f8fafc" font-size="30" font-weight="800">BUILD / RESEARCH / SHIP</text><rect x="45" y="120" width="1110" height="100" rx="18" fill="#0a101a" stroke="#334155"/><g font-family="monospace"><text x="72" y="150" fill="#64748b" font-size="11">GITHUB / PROJECT METRICS</text><text x="72" y="185" fill="#22d3ee" font-size="15">LIVE METRICS → README</text><text x="430" y="185" fill="#94a3b8" font-size="12">Repository stars · forks · commits · profile statistics</text></g><rect x="45" y="245" width="540" height="300" rx="18" fill="#0a101a" stroke="#334155"/><text x="72" y="282" fill="#f8fafc" font-size="20" font-weight="700">SECURITY SYSTEMS</text><g font-family="monospace" font-size="12"><rect x="70" y="305" width="490" height="42" rx="10" fill="#0f172a"/><text x="90" y="331" fill="#22d3ee">SHIELDDESK</text><text x="250" y="331" fill="#94a3b8">AI-assisted SOC control plane</text><rect x="70" y="357" width="490" height="42" rx="10" fill="#0f172a"/><text x="90" y="383" fill="#34d399">SENTINEL-IoT</text><text x="250" y="383" fill="#94a3b8">IoT honeypot / threat intelligence</text><rect x="70" y="409" width="490" height="42" rx="10" fill="#0f172a"/><text x="90" y="435" fill="#a78bfa">CTI ANALYSIS</text><text x="250" y="435" fill="#94a3b8">IOC / ATT&amp;CK / knowledge graph</text><rect x="70" y="461" width="490" height="42" rx="10" fill="#0f172a"/><text x="90" y="487" fill="#f472b6">VMP</text><text x="250" y="487" fill="#94a3b8">Risk-based vulnerability management</text><rect x="70" y="513" width="490" height="1" fill="#334155"/></g><rect x="615" y="245" width="540" height="300" rx="18" fill="#0a101a" stroke="#334155"/><text x="642" y="282" fill="#f8fafc" font-size="20" font-weight="700">OPERATING MODEL</text><g font-family="monospace" font-size="12"><rect x="640" y="305" width="490" height="54" rx="12" fill="#0f172a" stroke="#22d3ee" stroke-opacity=".25"/><text x="660" y="328" fill="#22d3ee">01  DETECT</text><text x="660" y="347" fill="#94a3b8">Collect signal and surface meaningful anomalies.</text><rect x="640" y="373" width="490" height="54" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-opacity=".25"/><text x="660" y="396" fill="#a78bfa">02  EXPLAIN</text><text x="660" y="415" fill="#94a3b8">Connect evidence, context and likely impact.</text><rect x="640" y="441" width="490" height="54" rx="12" fill="#0f172a" stroke="#34d399" stroke-opacity=".25"/><text x="660" y="464" fill="#34d399">03  VERIFY</text><text x="660" y="483" fill="#94a3b8">Test remediation before trusting the outcome.</text></g></g></svg>