<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520" role="img" aria-labelledby="t d">
<title id="t">Engineering Stack Console</title><desc id="d">Animated cybersecurity engineering stack across application, infrastructure, intelligence, AI and security.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070b"/><stop offset=".6" stop-color="#0a1020"/><stop offset="1" stop-color="#071412"/></linearGradient>
<linearGradient id="edge" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#34d399"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity=".055"/></pattern>
<style>
.t{font:700 30px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e2e8f0}.m{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px;fill:#22d3ee}.s{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#64748b}.h{font:700 13px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#e2e8f0}.v{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#94a3b8}.card{fill:#0b1220;stroke:#26364f}.pulse{animation:p 2s ease-in-out infinite}.flow{stroke-dasharray:5 10;animation:f 3s linear infinite}@keyframes p{50%{opacity:.35}}@keyframes f{to{stroke-dashoffset:-45}}@keyframes scan{0%{transform:translateY(0);opacity:0}15%{opacity:.35}85%{opacity:.35}100%{transform:translateY(470px);opacity:0}}
</style></defs>
<rect x="1" y="1" width="1398" height="518" rx="24" fill="url(#bg)" stroke="url(#edge)" stroke-opacity=".7"/><rect x="2" y="2" width="1396" height="516" rx="23" fill="url(#grid)"/>
<text x="32" y="35" class="m">// ENGINEERING STACK</text><text x="32" y="72" class="t">Security Engineering Console</text><text x="1085" y="35" class="s">SYSTEM STATUS</text><circle cx="1175" cy="31" r="5" fill="#34d399" class="pulse"/><text x="1188" y="35" class="h">ACTIVE</text>
<path d="M32 92H1368" stroke="#24354d"/><path d="M560 105V470" stroke="#24354d"/>
<g transform="translate(300 280)">
<circle r="112" fill="#08101c" stroke="#22d3ee" stroke-opacity=".16"/><circle r="82" fill="none" stroke="#8b5cf6" stroke-opacity=".18"/><circle r="54" fill="url(#core)" opacity=".95"><animate attributeName="r" values="50;57;50" dur="3s" repeatCount="indefinite"/></circle><circle r="40" fill="#07101a"/>
<text x="-31" y="-5" font-family="Arial" font-size="16" font-weight="700" fill="#fff">AI × CYBER</text><text x="-22" y="15" class="v">SECURITY CORE</text>
<g class="flow" fill="none"><path d="M-175,-80 C-95,-125 -45,-95 -15,-55" stroke="#22d3ee"/><path d="M175,-70 C105,-120 60,-95 20,-55" stroke="#8b5cf6"/><path d="M-175,90 C-90,120 -50,85 -18,55" stroke="#34d399"/><path d="M175,90 C100,125 55,90 18,55" stroke="#22d3ee"/></g>
<g class="pulse"><circle cx="-175" cy="-80" r="24" fill="#0b1624" stroke="#22d3ee"/><text x="-187" y="-76" class="h">PY</text><text x="-28" y="-132" class="s">PYTHON</text></g>
<g class="pulse"><circle cx="175" cy="-70" r="24" fill="#0b1624" stroke="#8b5cf6"/><text x="164" y="-66" class="h">AI</text><text x="135" y="-122" class="s">LLMs</text></g>
<g class="pulse"><circle cx="-175" cy="90" r="24" fill="#0b1624" stroke="#34d399"/><text x="-185" y="94" class="h">IoT</text><text x="-206" y="132" class="s">EMBEDDED</text></g>
<g class="pulse"><circle cx="175" cy="90" r="24" fill="#0b1624" stroke="#22d3ee"/><text x="163" y="94" class="h">OPS</text><text x="144" y="132" class="s">INFRA</text></g>
</g>
<g transform="translate(600 112)">
<g><rect width="735" height="62" rx="12" class="card"/><circle cx="20" cy="31" r="5" fill="#22d3ee" class="pulse"/><text x="36" y="27" class="h">APPLICATION</text><text x="36" y="45" class="v">React · TypeScript · FastAPI · Node.js · PostgreSQL</text></g>
<g transform="translate(0 72)"><rect width="735" height="62" rx="12" class="card"/><circle cx="20" cy="31" r="5" fill="#34d399" class="pulse"/><text x="36" y="27" class="h">INFRASTRUCTURE</text><text x="36" y="45" class="v">Docker · Redis · Linux · Nginx · GitHub Actions · AWS</text></g>
<g transform="translate(0 144)"><rect width="735" height="62" rx="12" class="card"/><circle cx="20" cy="31" r="5" fill="#8b5cf6" class="pulse"/><text x="36" y="27" class="h">AI &amp; INTELLIGENCE</text><text x="36" y="45" class="v">PyTorch · scikit-learn · LLMs · CTI · Graphs · MCP</text></g>
<g transform="translate(0 216)"><rect width="735" height="62" rx="12" class="card"/><circle cx="20" cy="31" r="5" fill="#f59e0b" class="pulse"/><text x="36" y="27" class="h">OFFENSIVE SECURITY</text><text x="36" y="45" class="v">Kali Linux · Burp Suite · Nmap · Wireshark · OWASP</text></g>
<g transform="translate(0 288)"><rect width="735" height="62" rx="12" class="card"/><circle cx="20" cy="31" r="5" fill="#22d3ee" class="pulse"/><text x="36" y="27" class="h">FORENSICS &amp; DEFENCE</text><text x="36" y="45" class="v">Volatility · PCAP · CASE · Threat Detection · Incident Response</text></g>
</g>
<rect x="24" y="505" width="3" height="12" fill="#22d3ee"><animate attributeName="y" values="90;500;90" dur="7s" repeatCount="indefinite"/></rect><text x="42" y="506" class="s">BUILD → TEST → DEPLOY → OBSERVE → VERIFY</text><text x="1080" y="506" class="s">CONTINUOUSLY LEARNING</text>
</svg>